spring.datasource.url=jdbc:mysql://localhost:3306/foodorder
spring.application.name=foodorder
spring.datasource.username=foodorder_dev
spring.datasource.password=${DB_PASSWORD}
server.port=8081



# ==========================================
# 회원가입 이메일 인증용 메일 발송 설정
# ==========================================

# 회원가입 인증 메일 발송
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
# SMTP 인사에 사용할 이름을 영문으로 고정
spring.mail.properties.mail.smtp.localhost=localhost

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Gmail 587 포트: STARTTLS 방식
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

foodorder.mail-from=${MAIL_FROM:}

# Google 소셜 로그인
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google
